name: Compilar APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Secretos del repositorio (Settings → Secrets and variables → Actions):
      #   ALFRED_KEYSTORE_BASE64  = contenido de alfred.jks en base64
      #   ALFRED_PASSWORD         = contraseña de la firma
      # Sin ellos el APK se firma con una clave de depuración y Google no lo reconocerá.
      - name: Preparar firma
        env:
          KS: ${{ secrets.ALFRED_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p keystore && echo "$KS" | base64 -d > keystore/alfred.jks; fi
      - name: Tests y APK
        env:
          ALFRED_FILE: keystore/alfred.jks
          ALFRED_PASSWORD: ${{ secrets.ALFRED_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Alfred.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Alfred-apk
          path: Alfred.apk
